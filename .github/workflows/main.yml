name: Generate Scenario and Deploy

on:
  repository_dispatch:
    types: [start-generation]

concurrency:
  group: scenario-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.client_payload.topic }}
          AUDIENCE: ${{ github.event.client_payload.audience }}
          WISHES: ${{ github.event.client_payload.wishes }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git pull --rebase
          git add .
          git commit -m "Update site: generated new scenario" || exit 0
          git push
