<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCENARIY — Генератор унікальних сценаріїв</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">SCENARIY</h1>
            <p class="subtitle">Автоматична генерація унікальних сценаріїв для будь-яких подій</p>
        </header>

        <!-- Форма генерації -->
        <main class="form-card">
            <h2>⚡ Створити власний сценарій</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="topic">Тема / Свято</label>
                    <input type="text" id="topic" placeholder="напр., День народження, Корпоратив">
                </div>
                <div class="form-group">
                    <label for="audience">Аудиторія / Вік</label>
                    <select id="audience">
                        <option value="Дорослі">Дорослі</option>
                        <option value="Діти">Діти</option>
                        <option value="Школярі">Школярі</option>
                        <option value="Змішана">Змішана</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="details">Побажання та деталі (необов'язково)</label>
                <textarea id="details" placeholder="напр., тривалість 1 година, веселі конкурси, тематика Піратів..."></textarea>
            </div>
            <button onclick="generateScenario()" class="btn-generate">🪄 Згенерувати сценарій</button>
        </main>

        <!-- Секція "Готові сценарії" -->
        <section class="scenarios-section">
            <div class="section-header">
                <h2>📚 Готові сценарії</h2>
                <input type="text" id="searchInput" onkeyup="filterScenarios()" placeholder="Пошук сценарію..." class="search-input">
            </div>

            <div id="scenariosGrid" class="scenarios-grid">
                <!-- Заглушки за замовчуванням (не зникнуть, якщо database.json ще порожній або недоступний) -->
                <div class="scenario-card" data-title="веселий день народження вечірка дорослі">
                    <div class="card-content">
                        <span class="card-tag">Вечірка</span>
                        <h3 class="card-title">Веселий День Народження</h3>
                        <p class="card-desc">Універсальна програма на 2 години з конкурсами та інтерактивами.</p>
                    </div>
                    <a href="#" class="btn-view">Переглянути</a>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>Знайшли щось цікаве?</p>
            <a href="https://buymeacoffee.com" target="_blank" class="btn-donate">☕ Підтримайте проект</a>
        </footer>
    </div>

    <script>
        async function loadScenariosFromDB() {
            const grid = document.getElementById('scenariosGrid');
            if (!grid) return;

            try {
                // Додаємо timestamp проти кешування GitHub Pages
                const response = await fetch('database.json?t=' + Date.now());
                
                if (!response.ok) {
                    console.warn(`database.json не знайдено (Статус: ${response.status}). Використовуються замовчувані картки.`);
                    return;
                }

                const db = await response.json();
                
                if (!db || !db.topics || Object.keys(db.topics).length === 0) {
                    console.warn("База даних порожня. Залишаємо базові картки.");
                    return;
                }

                // Масив для збору всіх сценаріїв
                const allScenarios = [];

                for (const categoryKey in db.topics) {
                    const category = db.topics[categoryKey];
                    if (category.scenarios && Array.isArray(category.scenarios)) {
                        category.scenarios.forEach(item => {
                            allScenarios.push({
                                ...item,
                                categoryName: category.name || categoryKey
                            });
                        });
                    }
                }

                if (allScenarios.length === 0) return;

                // Очищаємо картки-заглушки тільки якщо реально є дані з JSON
                grid.innerHTML = '';

                allScenarios.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'scenario-card';
                    card.setAttribute('data-title', `${item.title} ${item.categoryName} ${item.audience}`.toLowerCase());

                    card.innerHTML = `
                        <div class="card-content">
                            <span class="card-tag">${item.categoryName}</span>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">Аудиторія: ${item.audience}</p>
                        </div>
                        <a href="${item.file}" class="btn-view">Переглянути</a>
                    `;
                    grid.appendChild(card);
                });

            } catch (e) {
                console.error("Помилка завантаження/парсингу database.json:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', loadScenariosFromDB);

        function filterScenarios() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.scenario-card');

            cards.forEach(card => {
                const title = card.getAttribute('data-title') || card.innerText.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function generateScenario() {
            const topic = document.getElementById('topic').value.trim();
            const audience = document.getElementById('audience').value;
            const details = document.getElementById('details').value.trim();

            if (!topic) {
                alert("Будь ласка, вкажіть тему!");
                return;
            }

            const issueTitle = encodeURIComponent(`Generate: ${topic}`);
            const issueBody = encodeURIComponent(`**Тема:** ${topic}\n**Аудиторія:** ${audience}\n**Деталі:** ${details}`);

            const repoUrl = "https://github.com/scenariy/scenariy.github.io/issues/new";
            window.open(`${repoUrl}?title=${issueTitle}&body=${issueBody}`, '_blank');
        }
    </script>
</body>
</html>
