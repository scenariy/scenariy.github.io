<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCENARIY — Генератор унікальних сценаріїв</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <h1 class="logo">SCENARIY</h1>
            <p class="subtitle">Автоматична генерація унікальних сценаріїв для будь-яких подій</p>
        </header>

        <!-- Форма генерації -->
        <main class="scenario-card">
            <h2>⚡ Створити власний сценарій</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="topic">Тема / Свято</label>
                    <input type="text" id="topic" placeholder="напр., День народження, Корпоратив">
                </div>
                
                <div class="form-group">
                    <label for="audience">Аудиторія / Вік</label>
                    <select id="audience">
                        <option value="Дорослі">Дорослі</option>
                        <option value="Діти">Діти</option>
                        <option value="Школярі">Школярі</option>
                        <option value="Змішана">Змішана</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="details">Побажання та деталі (необов'язково)</label>
                <textarea id="details" placeholder="напр., тривалість 1 година, веселі конкурси, тематика Піратів..."></textarea>
            </div>

            <button id="submitBtn" onclick="generateScenario()" class="btn-generate">🪄 Згенерувати сценарій</button>
            <p id="statusMsg" style="margin-top: 10px; font-size: 0.9rem; text-align: center; color: var(--primary-yellow);"></p>
        </main>

        <!-- Секція каталогу -->
        <section class="scenarios-section">
            <div class="section-header">
                <h2>📚 Готові сценарії</h2>
                <input type="text" id="searchInput" onkeyup="filterScenarios()" placeholder="Пошук сценарію..." class="search-input">
            </div>

            <div id="scenariosGrid" class="scenarios-grid">
                <!-- Сюди підвантажуються картки з database.json -->
            </div>
        </section>

        <!-- Футер -->
        <footer class="footer">
            <p>Знайшли щось цікаве?</p>
            <a href="https://buymeacoffee.com" target="_blank" class="btn-donate">☕ Підтримайте проект</a>
        </footer>
    </div>

    <script>
        // 🔗 ВСТАВ СЮДИ СВОЄ ПОСИЛАННЯ НА GOOGLE APPS SCRIPT WEB APP
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/ХХХХХХХХХХХХХХХХХХХХХ/exec";

        // Завантаження карток з database.json
        async function loadScenariosFromDB() {
            const grid = document.getElementById('scenariosGrid');
            if (!grid) return;

            try {
                const response = await fetch('database.json?t=' + Date.now());
                if (!response.ok) return;

                const db = await response.json();
                if (!db || !db.topics || Object.keys(db.topics).length === 0) return;

                const allScenarios = [];
                for (const categoryKey in db.topics) {
                    const category = db.topics[categoryKey];
                    if (category.scenarios && Array.isArray(category.scenarios)) {
                        category.scenarios.forEach(item => {
                            allScenarios.push({
                                ...item,
                                categoryName: category.name || categoryKey
                            });
                        });
                    }
                }

                if (allScenarios.length === 0) return;

                grid.innerHTML = ''; 

                allScenarios.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'scenario-card-item';
                    card.setAttribute('data-title', `${item.title} ${item.categoryName} ${item.audience}`.toLowerCase());

                    card.innerHTML = `
                        <div class="card-content">
                            <span class="card-tag">${item.categoryName}</span>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">Аудиторія: ${item.audience}</p>
                        </div>
                        <a href="${item.file}" class="btn-view">Переглянути</a>
                    `;
                    grid.appendChild(card);
                });

            } catch (e) {
                console.error("Помилка завантаження database.json:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', loadScenariosFromDB);

        // Пошукова фільтрація
        function filterScenarios() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.scenario-card-item');

            cards.forEach(card => {
                const title = card.getAttribute('data-title') || card.innerText.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 🚀 НАЙВАЖЛИВІШЕ: Відправка на Google Apps Script без авторизацій
        async function generateScenario() {
            const topic = document.getElementById('topic').value.trim();
            const audience = document.getElementById('audience').value;
            const details = document.getElementById('details').value.trim();
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');

            if (!topic) {
                alert("Будь ласка, вкажіть тему!");
                return;
            }

            btn.disabled = true;
            btn.style.opacity = "0.6";
            statusMsg.innerText = "⏳ Запит відправлено! Генерація займає ~1 хвилину...";

            try {
                // Відправляємо фоновий POST-запит на міст Google Apps Script
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Потрібно для Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic: topic,
                        audience: audience,
                        wishes: details
                    })
                });

                statusMsg.innerText = "✅ Сценарій взято в обробку! Сторінка оновиться через кілька хвилин.";
                document.getElementById('topic').value = '';
                document.getElementById('details').value = '';

            } catch (error) {
                console.error("Помилка відправки:", error);
                statusMsg.innerText = "❌ Помилка відправки запиту. Спробуйте ще раз.";
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }, 5000);
            }
        }
    </script>
</body>
</html>
